[package]
# The mquickjs OpenVela adapter (RIDL leaf: app-id `mqjs`). This is the
# integration-side crate: everything else (engine, mquickjs-rs, -sys,
# ridl-glue, stdlib module) comes from the mquickjs-rs-sdk checkout that
# the repo manifest places at <tree>/external/mquickjs-rs-sdk -- hence the
# ../../../../ path prefix (rust/ -> mqjs -> system -> apps -> tree root).
#
# Dual-mode target wiring (std on linux / no-std elsewhere) is upstream
# SDK content (Phase 3.4).
name = "mqjs"
version = "0.4.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

# 运行模式随构建目标切换（Phase 3.4）：
#
# - `target_os = "linux"`（openvela sim：宿主 Linux 进程，glibc 动态链接）
#   → std 模式。RIDL stdlib（console）的 std I/O 原生工作。
# - 其他目标（QEMU aarch64 裸机 `aarch64-unknown-none`，-C panic=abort）
#   → no-std 模式。本 crate 的 no_std 分支提供 `#[global_allocator]`
#   （NuttX malloc/free 桥）、`#[panic_handler]` 与 eh_personality 桩，
#   console 输出由 stdlib 的 no_std 模式经 FFI printf 落到 NuttX 控制台。
#
# 模式 feature 经 target-specific dependencies 注入：cargo 只合并匹配
# 目标的表，因此同一份源码在 sim（host target）与 aarch64 上各自解析出
# 恰好一种模式（std 与 no-std 互斥由下游 crate 的 compile_error 兜底）。
[dependencies]
mquickjs-rs = { path = "../../../../external/mquickjs-rs-sdk/deps/mquickjs-rs", default-features = false, features = ["ridl-extensions"] }
mquickjs-ui = { path = "../../../../external/mquickjs-ui", default-features = false }

[dependencies.stdlib]
path = "../../../../external/mquickjs-rs-sdk/ridl-modules/stdlib"
default-features = false

[target.'cfg(target_os = "linux")'.dependencies]
# default-features 必须显式关：多表声明的依赖会按目标合并，
# 任何适用表漏关都会把 mquickjs-rs/stdlib 的 default（std）拉回图里。
mquickjs-rs = { path = "../../../../external/mquickjs-rs-sdk/deps/mquickjs-rs", default-features = false, features = ["std"] }
stdlib = { path = "../../../../external/mquickjs-rs-sdk/ridl-modules/stdlib", default-features = false, features = ["std"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
mquickjs-rs = { path = "../../../../external/mquickjs-rs-sdk/deps/mquickjs-rs", default-features = false, features = ["no-std"] }
stdlib = { path = "../../../../external/mquickjs-rs-sdk/ridl-modules/stdlib", default-features = false, features = ["no-std"] }

[build-dependencies]
mquickjs-ridl-glue = { path = "../../../../external/mquickjs-rs-sdk/deps/mquickjs-ridl-glue" }
